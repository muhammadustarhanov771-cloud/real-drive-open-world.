<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>REAL DRIVE — Prototype</title><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#111;color:white;font-family:system-ui,sans-serif}#hud{position:absolute;top:16px;left:16px;background:#101820bb;padding:12px 16px;border-radius:14px;pointer-events:none}#speed{font-size:32px;font-weight:800}#help{font-size:12px;opacity:.8}#controls{position:absolute;bottom:22px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}.cluster{display:flex;gap:9px}button{pointer-events:auto;border:1px solid #ffffff77;background:#17232dcc;color:white;border-radius:14px;padding:17px;font-size:19px;touch-action:none;user-select:none}#camera{position:absolute;right:16px;top:18px;font-size:13px;padding:12px}canvas{display:block}</style></head><body>
<div id="hud"><div>REAL DRIVE • PROTOTYPE</div><div><span id="speed">0</span> км/ч</div><div id="help">WASD / стрелки · Space — тормоз · C — камера</div></div><button id="camera">Камера (C)</button><div id="controls"><div class="cluster"><button data-key="left">◀</button><button data-key="right">▶</button></div><div class="cluster"><button data-key="brake">■</button><button data-key="back">▼</button><button data-key="forward">▲</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x93c9f0);scene.fog=new THREE.Fog(0x93c9f0,130,400);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,600);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x566c60,2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(50,100,30);scene.add(sun);
function box(w,h,d,color,x,y,z,parent=scene){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color,roughness:.85}));m.position.set(x,y,z);parent.add(m);return m;}
box(600,.2,600,0x4e9360,0,-.16,0);box(24,.05,600,0x353b43,0,-.04,0);box(600,.05,22,0x353b43,0,-.035,0);
for(let p=-280;p<=280;p+=18){box(.25,.02,7,0xffe7a5,0,.01,p);box(7,.02,.25,0xffe7a5,p,.01,0);}
for(let x=-250;x<=250;x+=34)for(let z=-250;z<=250;z+=34){if(Math.abs(x)<23||Math.abs(z)<23)continue;let h=8+(Math.abs((x*17+z*13)%31));box(16,h,16,new THREE.Color().setHSL(.55,.08,.35+((x+z+600)%5)*.055),x,h/2,z);}
const car=new THREE.Group();scene.add(car);box(2.2,.65,4.5,0xc82e36,0,.8,0,car);box(1.8,.65,2.2,0x273a4b,0,1.4,-.35,car);
for(const x of [-1.14,1.14])for(const z of [-1.35,1.35]){const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.48,.48,.28,16),new THREE.MeshStandardMaterial({color:0x111111}));wheel.rotation.z=Math.PI/2;wheel.position.set(x,.47,z);car.add(wheel);}
box(.48,.15,.12,0xfff3be,-.7,.85,-2.27,car);box(.48,.15,.12,0xfff3be,.7,.85,-2.27,car);car.position.set(0,0,55);
const held=new Set();const keys={ArrowUp:'forward',KeyW:'forward',ArrowDown:'back',KeyS:'back',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'brake'};let cameraMode=0;
addEventListener('keydown',e=>{if(keys[e.code]){held.add(keys[e.code]);e.preventDefault();}if(e.code==='KeyC'&&!e.repeat)cameraMode=(cameraMode+1)%2;});addEventListener('keyup',e=>held.delete(keys[e.code]));
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{b.setPointerCapture(e.pointerId);held.add(k)});for(const type of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(type,()=>held.delete(k));});
document.getElementById('camera').onclick=()=>cameraMode=(cameraMode+1)%2;addEventListener('blur',()=>held.clear());
let speed=0,heading=0;const clock=new THREE.Clock(),up=new THREE.Vector3(0,1,0),offset=new THREE.Vector3(),target=new THREE.Vector3();
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);let throttle=(held.has('forward')?1:0)-(held.has('back')?1:0);speed+=throttle*19*dt;speed*=Math.exp(-(held.has('brake')?5:0.55)*dt);speed=THREE.MathUtils.clamp(speed,-13,38);if(Math.abs(speed)<.03)speed=0;
const steering=(held.has('left')?1:0)-(held.has('right')?1:0);heading+=steering*Math.min(Math.abs(speed)/8,1)*Math.sign(speed)*1.25*dt;car.rotation.y=heading;car.position.x+=-Math.sin(heading)*speed*dt;car.position.z+=-Math.cos(heading)*speed*dt;car.position.x=THREE.MathUtils.clamp(car.position.x,-290,290);car.position.z=THREE.MathUtils.clamp(car.position.z,-290,290);
offset.set(0,cameraMode?2.3:5,cameraMode?-1.5:11).applyAxisAngle(up,heading);target.copy(car.position).add(offset);camera.position.lerp(target,1-Math.exp(-7*dt));const look=new THREE.Vector3(0,cameraMode?1.1:1, cameraMode?-18:-8).applyAxisAngle(up,heading).add(car.position);camera.lookAt(look);document.getElementById('speed').textContent=Math.round(Math.abs(speed)*3.6);renderer.render(scene,camera);}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});animate();
</script></body></html>
